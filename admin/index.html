<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Orders | Pinch of Spice Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

    <!-- Login -->
    <div class="admin-login" id="loginView">
        <form class="login-card" id="loginForm">
            <h1>Pinch of Spice</h1>
            <p class="login-sub">Staff orders dashboard</p>
            <label for="email">Email</label>
            <input type="email" id="email" autocomplete="username" required>
            <label for="password">Password</label>
            <input type="password" id="password" autocomplete="current-password" required>
            <button type="submit" class="btn btn-primary" id="loginBtn">Sign in</button>
            <p class="login-error" id="loginError" hidden></p>
        </form>
    </div>

    <!-- Dashboard -->
    <div class="admin-shell" id="dashView" hidden>
        <header class="admin-header">
            <div>
                <h1>Orders</h1>
                <p class="admin-sub" id="connState">Live</p>
            </div>
            <button class="btn btn-secondary" id="signOutBtn">Sign out</button>
        </header>

        <nav class="admin-tabs">
            <button class="admin-tab active" data-view="orders">Orders</button>
            <button class="admin-tab" data-view="menu">Menu</button>
        </nav>

        <section id="ordersView">
        <section class="admin-stats">
            <div class="stat"><span class="stat-num" id="statPending">0</span><span class="stat-label">Pending</span></div>
            <div class="stat"><span class="stat-num" id="statToday">0</span><span class="stat-label">Orders today</span></div>
            <div class="stat"><span class="stat-num" id="statRevenue">Rs.0</span><span class="stat-label">Today's total</span></div>
        </section>

        <nav class="admin-filters">
            <button class="filter-btn active" data-status="all">All</button>
            <button class="filter-btn" data-status="pending">Pending</button>
            <button class="filter-btn" data-status="preparing">Preparing</button>
            <button class="filter-btn" data-status="delivered">Delivered</button>
            <button class="filter-btn" data-status="cancelled">Cancelled</button>
        </nav>

        <main class="admin-orders" id="orderList">
            <p class="admin-empty">Loading orders...</p>
        </main>
        </section>

        <section id="menuView" hidden>
            <div class="menu-toolbar">
                <div>
                    <h2 class="menu-heading">Menu</h2>
                    <p class="admin-sub" id="menuState">&nbsp;</p>
                </div>
                <div class="menu-toolbar-actions">
                    <button class="btn btn-ghost btn-sm" id="importMenuBtn">Import current menu</button>
                    <button class="btn btn-primary btn-sm" id="addDishBtn">Add dish</button>
                </div>
            </div>

            <form class="dish-form" id="dishForm" hidden>
                <h3 id="dishFormTitle">Add a dish</h3>
                <div class="dish-grid">
                    <label>Dish name
                        <input type="text" id="dishName" required maxlength="80">
                    </label>
                    <label>Category
                        <select id="dishCategory" required></select>
                    </label>
                    <label>Type
                        <select id="dishType" required>
                            <option value="veg">Veg</option>
                            <option value="non-veg">Non-Veg</option>
                        </select>
                    </label>
                    <label>Half price (Rs.)
                        <input type="number" id="dishHalf" min="0" max="100000" placeholder="leave blank if none">
                    </label>
                    <label>Full price (Rs.)
                        <input type="number" id="dishFull" min="0" max="100000" required>
                    </label>
                    <label>Image URL (optional)
                        <input type="url" id="dishImage" maxlength="500" placeholder="https://...">
                    </label>
                </div>
                <div class="dish-form-actions">
                    <button type="button" class="btn btn-ghost btn-sm" id="cancelDishBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary btn-sm" id="saveDishBtn">Save dish</button>
                </div>
                <p class="dish-error" id="dishError" hidden></p>
            </form>

            <div class="menu-filters" id="menuCategoryFilters"></div>
            <main id="dishList"><p class="admin-empty">Loading menu...</p></main>
        </section>
    </div>

    <script type="module" src="../js/admin.js"></script>
</body>
</html>
